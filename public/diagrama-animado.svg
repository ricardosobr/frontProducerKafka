<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 466" width="1200" height="466" role="img" aria-labelledby="dg-title dg-desc">
  <title id="dg-title">Cómo viaja una consulta de clientes</title>
  <desc id="dg-desc">De la interfaz a Kafka y de vuelta, con la respuesta correlacionada</desc>
  <defs>
